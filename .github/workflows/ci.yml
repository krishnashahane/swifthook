name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'
      - name: Verify formatting
        run: test -z "$(swift-format lint --recursive Sources SwiftHookTests 2>/dev/null || true)"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
